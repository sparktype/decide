[package]
name = "decide"
version = "0.4.1"
edition = "2021"
description = "Choice, score, and noul decisions via TypeSafe Jev or a local model"
publish = false

[[bin]]
name = "decide"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
candle-core = "0.9"
candle-nn = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
mlx-rs = "0.32"
mlx-sys = "0.6"

[features]
parity = []
