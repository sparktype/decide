name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --manifest-path crates/decide/Cargo.toml

      - name: Build release binary
        run: cargo build --release --manifest-path crates/decide/Cargo.toml

      - name: Package
        run: |
          mkdir -p dist stage
          cp crates/decide/target/release/decide stage/decide
          tar -czf "dist/decide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" -C stage decide
          shasum -a 256 dist/*.tar.gz > dist/checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
