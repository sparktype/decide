name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # macos-14의 기본 Xcode 15.4(Metal 3.1 컴파일러)는 MLX 커널이 쓰는 metal::remove_addrspace_t가
      # 없어 컴파일에 실패한다. 같은 러너에 깔린 Xcode 16 계열 중 가장 높은 것을 고른다. 러너 OS는
      # 그대로 14라 MLX가 Sonoma용 metallib를 만든다.
      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # mlx-rs가 MLX C++와 Metal 커널을 컴파일한다. Metal 컴파일러가 없으면(Xcode 26 이후는
      # 별도 컴포넌트) 내려받고, cmake가 없으면 설치한다.
      - name: Metal toolchain and cmake
        run: |
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          command -v cmake >/dev/null 2>&1 || brew install cmake
          xcrun metal --version

      - name: Test
        run: cargo test --manifest-path crates/decide/Cargo.toml

      - name: Build release binary
        run: cargo build --release --manifest-path crates/decide/Cargo.toml

      # MLX는 GPU 커널 묶음 mlx.metallib을 실행 파일 옆에서 먼저 찾고, 없으면 빌드 러너의 홈에 박힌
      # 경로(/Users/runner/.mlx/lib/...)로 떨어진다. 그 경로는 사용자 머신에 없어서 압축 파일에
      # 바이너리와 함께 넣지 않으면 추론이 전부 실패한다(v0.2.0이 그랬다).
      - name: Package
        run: |
          mkdir -p dist stage
          METALLIB=$(find crates/decide/target/release -name mlx.metallib | head -1)
          test -n "$METALLIB" || { echo "mlx.metallib을 찾을 수 없다"; exit 1; }
          cp crates/decide/target/release/decide stage/decide
          cp "$METALLIB" stage/mlx.metallib
          tar -czf "dist/decide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" -C stage decide mlx.metallib
          shasum -a 256 dist/*.tar.gz > dist/checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
